name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # brief pins Python 3.12; also guard 3.13 early-adopter compat
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check backend
      - run: python -m pytest backend/tests -q
      - name: OpenAPI schema check
        run: |
          python - <<'PY'
          from app.main import app
          spec = app.openapi()
          assert spec["openapi"].startswith("3.")
          print("OpenAPI OK:", len(spec["paths"]), "paths")
          PY

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Frontend lands in build step 2; until then this job passes trivially.
      - name: Skip until frontend exists
        id: guard
        run: echo "present=$(test -f frontend/package.json && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.present == 'yes'
        with:
          node-version: "20"  # brief pins Node 20 LTS
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
        if: steps.guard.outputs.present == 'yes'
        working-directory: frontend
      - run: npm run build
        if: steps.guard.outputs.present == 'yes'
        working-directory: frontend