name: Publish image

# Builds the single-container image and pushes it to GHCR on every green push
# to main — this is what makes Unraid's "update stack" actually update:
# the compose file points at ghcr.io, so `docker compose pull` gets the
# exact code CI just validated. Runs AFTER CI passes (needs: ci).
on:
  push:
    branches: [main]

jobs:
  backend:  # reuse CI's checks inline; publish only when they pass
    uses: ./.github/workflows/ci.yml

  publish:
    needs: backend
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: ver
        run: echo "version=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/latablee:latest
            ghcr.io/${{ github.repository_owner }}/latablee:v${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max