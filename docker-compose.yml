# LaTablée — ONE container (option 3): FastAPI serves the API *and* the web UI.
# Default: SQLite volume. Postgres profile: docker compose --profile postgres up -d
services:
  latablee:
    build: .
    image: latablee
    # Source-built image (no Docker Hub repo) — never pull, always build.
    # Without this, "update stack" / `docker compose pull` errors on the missing Hub image.
    pull_policy: build
    environment:
      - LATABLEE_SECRET_KEY=${LATABLEE_SECRET_KEY:?set LATABLEE_SECRET_KEY in .env}
      - LATABLEE_DATABASE_URL=${LATABLEE_DATABASE_URL:-sqlite:///./data/latablee.db}
      - LATABLEE_CORS_ORIGINS=${LATABLEE_CORS_ORIGINS:-http://localhost:3000}
      - LATABLEE_PUBLIC_ORIGIN=${LATABLEE_PUBLIC_ORIGIN:-http://localhost:3000}
      # Web UI is baked in and served by the API (single-container mode)
      - LATABLEE_STATIC_DIR=/srv/latablee/static
      # Optional: preconfigure the LLM here instead of via UI Settings
      - LATABLEE_LLM_BASE_URL=${LATABLEE_LLM_BASE_URL:-}
      - LATABLEE_LLM_API_KEY=${LATABLEE_LLM_API_KEY:-}
      - LATABLEE_LLM_MODEL=${LATABLEE_LLM_MODEL:-}
      - LATABLEE_LLM_VISION_MODEL=${LATABLEE_LLM_VISION_MODEL:-}
    volumes:
      - latablee-data:/srv/latablee/data
    ports:
      - "3000:3000"
    restart: unless-stopped

  # Optional Postgres — activates with: docker compose --profile postgres up -d
  # then set LATABLEE_DATABASE_URL=postgresql://latablee:***@db:5432/latablee in your dotenv file
  db:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      - POSTGRES_USER=latablee
      - POSTGRES_PASSWORD=posablee
      - POSTGRES_DB=latablee
    volumes:
      - latablee-pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # One-shot demo seed (ONLY works on an empty database):
  #   docker compose --profile seed run --rm seed
  # Creates "Demo Household" with 12 recipes, a sample week, groceries, and
  # admin login  Admin / latablee-demo  — change or delete after the tour.
  seed:
    profiles: ["seed"]
    build: .
    image: latablee
    pull_policy: build
    command: ["python", "-m", "app.seed"]
    environment:
      - LATABLEE_SECRET_KEY=${LATABLEE_SECRET_KEY:-seed-run-no-auth-needed}
      - LATABLEE_DATABASE_URL=${LATABLEE_DATABASE_URL:-sqlite:///./data/latablee.db}
    volumes:
      - latablee-data:/srv/latablee/data
    restart: "no"

volumes:
  latablee-data:
  latablee-pgdata: