# LaTablée web — serves the Next.js static export with an /api + /images proxy.
# SPA fallback keeps client-side routes (e.g. /recipes/3/) working on refresh.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip for text assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API + recipe images proxy to the FastAPI service (same-origin in prod)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;   # recipe photo imports
    }
    location /images/ {
        proxy_pass http://api:8000/images/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # hashed build assets are immutable
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: unknown paths -> index.html (client router takes over)
    location / {
        try_files $uri $uri/index.html /index.html;
    }
}